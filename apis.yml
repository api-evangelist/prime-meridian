aid: prime-meridian
name: Prime Meridian
description: >-
  Prime Meridian (Prime Meridian Labs) is an AI-powered consumer tax
  preparation and e-filing service that files federal and state income tax
  returns for free. Users upload their tax documents, answer a few clarifying
  questions, and the platform's AI generates a plain-language return covering
  W-2 employment, self-employment (Schedule C), K-1 partnership income, and
  multi-state situations, then e-files it with the IRS and state authorities in
  roughly fifteen minutes. The company is backed by General Catalyst and counts
  former IRS Commissioner Daniel Werfel among its strategic advisors. It is a
  consumer web application with no public developer API surface at this time.
